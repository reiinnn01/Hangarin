{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Task App{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#202020">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
</head>
<body>
    <div class="container">

        <div class="sidebar-left">
            <details class="user-profile-dropdown">
                <summary class="user-profile">
                    <img src="{% static 'Flower_GIF.gif' %}" class="profile-pic" alt="User Avatar">
                    <div class="user-info">
                        <p class="username">{{ request.user.username }}</p>
                        <p class="email">{{ request.user.email }}</p>
                    </div>
                </summary>
                <div class="dropdown-menu">
                    <a href="{% url 'account_logout' %}">Logout</a>
                </div>
            </details>
            <form method="GET" action="{% url 'global-search' %}" class="sidebar-search">
                <input
                    type="text"
                    name="q"
                    placeholder="Search..."
                    value="{{ request.GET.q }}"
                    autocomplete="off"
                >
            </form>
        
            <div class="options">

                <a href="{% url 'task-list' %}"
                   class="{% if request.resolver_match.url_name == 'task-list' %}active{% endif %}">
                    Task
                </a>
            
                <a href="{% url 'subtask-list' %}"
                   class="{% if request.resolver_match.url_name == 'subtask-list' %}active{% endif %}">
                    Sub Task
                </a>
            
                <a href="{% url 'note-list' %}"
                   class="{% if request.resolver_match.url_name == 'note-list' %}active{% endif %}">
                    Note
                </a>
            
                <a href="{% url 'priority-list' %}"
                   class="{% if request.resolver_match.url_name == 'priority-list' %}active{% endif %}">
                    Priority
                </a>
            
                <a href="{% url 'category-list' %}"
                   class="{% if request.resolver_match.url_name == 'category-list' %}active{% endif %}">
                    Category
                </a>
            
            </div>
        </div>

        
        {% block main_content %}
        {% endblock %}
        
        {% block right_sidebar %}
        {% endblock %}
        
    </div>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("{% static 'sw.js' %}")
                    .then(() => console.log("Service worker registered"))
                    .catch(error => console.error("Service worker error:", error));
            });
        }
    </script>
</body>
</html>
